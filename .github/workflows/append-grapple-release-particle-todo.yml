name: Append grapple release particle Todo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/append-grapple-release-particle-todo.yml

permissions:
  contents: write

jobs:
  append-todo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Insert Todo item
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/Todo.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Completed / superseded references"
          signature = "Fix grapple-release gold motes so they collide naturally with walls"
          item = """- [ ] Fix grapple-release gold motes so they collide naturally with walls and persist across rapid re-grapples. Confirmed root causes: `src/sim/clusters/grappleShared.ts::releaseGrapple` converts the ten active chain slots (`GRAPPLE_SEGMENT_COUNT = 10`) into unowned free particles by setting `behaviorMode = 0`, but they remain the special `ParticleKind.Gold`; `src/sim/particles/walls.ts::applyWallForces` exempts only unowned `ParticleKind.Golden`, so released chain motes currently enter the generic 18-world-unit wall-avoidance field and can receive up to 2800 force before contact. `src/sim/clusters/grapple.ts::fireGrapple` then reinitializes the same fixed slots on the next grapple, immediately erasing the previous release burst. Required behavior: released grapple motes receive no pre-contact wall repulsion or tile avoidance; they move freely until actual surface contact, then reflect off the contacted face and retain exactly 50% of their pre-impact speed (apply 0.50 damping to the full reflected velocity vector without changing the generic 0.60 bounce used by unrelated particles). Preserve the current deterministic spread, jump-off proximity/downward bias, fade timing, visual `ParticleKind.Gold`, and active-chain behavior. Decouple released motes from the reusable active-chain slots with a bounded dedicated transient pool or equivalent explicit release classification: allow up to three full grapples of released particles simultaneously (`3 * GRAPPLE_SEGMENT_COUNT = 30`) while retaining the ten slots needed by the current active chain; firing the second or third grapple must not replace still-live particles from earlier releases, and only a fourth overlapping release may evict/reuse particles according to a deterministic oldest-first policy (dead/expired slots first). Keep released motes transient, unowned, excluded from player dust/mote counts, binding, combat damage, respawn, save data, and resident-room transfer; reset them cleanly on room/world lifecycle boundaries. Likely files: `src/sim/clusters/grappleShared.ts`, `src/sim/clusters/grapple.ts`, `src/sim/particles/walls.ts`, `src/sim/world.ts` if dedicated pool metadata is needed, and focused grapple-particle tests. Add deterministic tests for zero force while near-but-not-touching a wall, correct reflection and 0.50 speed after horizontal/vertical impacts, no repeated pre-contact acceleration, simultaneous persistence of one/two/three release bursts, deterministic fourth-burst eviction, active-chain independence, jump-off release behavior, lifetime expiry/reset, and exclusion from dust counts/combat/transfer. Run targeted grapple/particle tests, then `npm run build`, `npm run lint`, and `npm test`; increment `BUILD_NUMBER` exactly once when implementing the code change."""

          if signature in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit(f"Insertion marker not found: {marker}")

          path.write_text(text.replace(marker, item + "\n\n" + marker, 1), encoding="utf-8")
          PY

      - name: Commit Todo update
        shell: bash
        run: |
          if git diff --quiet -- docs/Todo.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Todo.md
          git commit -m "docs: add grapple release particle todo"
          git push origin HEAD:main
