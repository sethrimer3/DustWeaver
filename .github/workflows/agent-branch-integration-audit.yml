name: Agent branch integration audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  find-orphaned-agent-work:
    runs-on: ubuntu-latest
    steps:
      - name: Require every unmerged AI branch to have an open PR
        uses: actions/github-script@v7
        with:
          script: |
            const prefixes = ["agent/", "codex/", "claude/", "copilot/"];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              protected: false,
              per_page: 100,
            });
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: defaultBranch,
              per_page: 100,
            });
            const coveredHeads = new Set(
              openPulls
                .filter((pull) => pull.head.repo?.full_name === `${owner}/${repo}`)
                .map((pull) => pull.head.ref),
            );
            const orphaned = [];

            for (const branch of branches) {
              if (!prefixes.some((prefix) => branch.name.startsWith(prefix))) continue;
              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: defaultBranch,
                head: branch.name,
              });
              if (comparison.data.ahead_by === 0 || coveredHeads.has(branch.name)) continue;
              orphaned.push({
                branch: branch.name,
                ahead: comparison.data.ahead_by,
                behind: comparison.data.behind_by,
                sha: branch.commit.sha.slice(0, 12),
              });
            }

            if (orphaned.length === 0) {
              core.summary.addHeading("Agent branch integration audit");
              core.summary.addRaw(`No unmerged AI branches without an open PR targeting \`${defaultBranch}\`.`);
              await core.summary.write();
              return;
            }

            core.summary.addHeading("Orphaned agent work");
            core.summary.addTable([
              [
                { data: "Branch", header: true },
                { data: "Ahead", header: true },
                { data: "Behind", header: true },
                { data: "Tip", header: true },
              ],
              ...orphaned.map((item) => [
                item.branch,
                String(item.ahead),
                String(item.behind),
                item.sha,
              ]),
            ]);
            await core.summary.write();
            core.setFailed(
              `${orphaned.length} AI branch(es) contain commits not on ${defaultBranch} and have no open PR: ` +
              orphaned.map((item) => item.branch).join(", "),
            );
