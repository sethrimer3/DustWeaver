name: One-time localization Todo update

on:
  push:
    paths:
      - .github/workflows/one-time-add-localization-todo.yml

permissions:
  contents: write

jobs:
  update-todo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert localization Todo item and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo_path = Path("docs/Todo.md")
          workflow_path = Path(".github/workflows/one-time-add-localization-todo.yml")
          text = todo_path.read_text(encoding="utf-8")
          marker = "## Deferred / medium priority\n\n"
          item = "- [ ] Add first-class localization/i18n support so all player-facing game, campaign, pause/settings, HUD, dialogue, editor, accessibility, and error/loading text can be translated without editing gameplay code. Introduce a centralized typed translation-key API and locale catalogs (English as the complete source and per-key fallback), replace hard-coded UI strings with keys plus interpolation/pluralization, and add a language selector that applies immediately and persists independently of campaign/save data. Use the platform locale only as a safe first-launch default; missing/invalid locales or keys must fall back to English without displaying raw keys or crashing. Preserve deterministic simulation and save compatibility; do not translate internal IDs, asset paths, debug-only identifiers, or player-authored campaign text unless an explicit localized-content schema is added. Ensure the pixel-art UI handles longer/shorter strings, Unicode, accents, non-Latin glyphs, wrapping/truncation, and font fallback without clipping; design the API so right-to-left layout can be added later without rewriting callers, even if RTL is outside the first release. Likely subsystems: a new `src/i18n/` runtime/catalog layer, main-menu and pause/settings language controls, shared DOM/canvas text renderers, HUD/dialogue/editor strings, preference persistence, and font loading. Acceptance criteria: English and at least one non-English test locale can switch at runtime across representative DOM and canvas screens; the choice survives restart; fallback, interpolation, and pluralization are deterministic and tested; a catalog-parity/extraction test or lint guard detects missing keys and newly introduced hard-coded player-facing strings; locale alone does not alter simulation/save hashes; and targeted localization tests plus `npm run build`, `npm run lint`, and `npm test` pass. Increment `BUILD_NUMBER` exactly once for the coherent implementation."

          if item not in text:
              if marker not in text:
                  raise SystemExit("Deferred / medium priority marker not found")
              text = text.replace(marker, marker + item + "\n", 1)
              todo_path.write_text(text, encoding="utf-8")

          workflow_path.unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Todo.md .github/workflows/one-time-add-localization-todo.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add multilingual support Todo item"
          git push
